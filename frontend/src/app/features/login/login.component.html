<div class="login-page">
  <header class="site-header">
    <div class="logo">CINE<span class="accent">CONCORDIA</span></div>
    <a routerLink="/" class="back-link">&lsaquo; Volver al sitio</a>
  </header>

  <main class="login-main">
    <section class="login-card">
      <p class="eyebrow">Acceso administrador</p>
      <h1>Iniciar sesi&oacute;n</h1>

      @if (error()) {
        <p class="login-error">{{ error() }}</p>
      }

      <form class="login-form" (ngSubmit)="ingresar()">
        <label class="field">
          <span class="field-label">Email</span>
          <input
            type="email"
            name="email"
            placeholder="tu@email.com"
            autocomplete="email"
            [(ngModel)]="email"
            required
          />
        </label>

        <label class="field">
          <span class="field-label">Contrase&ntilde;a</span>
          <span class="password-wrap">
            <input
              [type]="verPassword ? 'text' : 'password'"
              name="password"
              placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
              autocomplete="current-password"
              [(ngModel)]="password"
              required
            />
            <button type="button" class="toggle-pass" (click)="toggleVerPassword()">
              {{ verPassword ? 'Ocultar' : 'Ver' }}
            </button>
          </span>
        </label>

        <button type="submit" class="btn btn-primary btn-lg" [disabled]="enviando()">
          {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="logo logo-sm">CINE<span class="accent">CONCORDIA</span></div>
    <p>&copy; 2026 Cine Concordia. Todos los derechos reservados.</p>
  </footer>
</div>
